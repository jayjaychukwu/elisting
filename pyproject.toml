[project]
name = "elisting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-yasg>=1.21.15",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers -q"

[tool.black]
line-length = 100
target-version = ["py312"]
# Migrations are generated by Django; formatters should leave them alone.
extend-exclude = "/migrations/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv*", ".ruff_cache*", ".pytest_cache*", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "RUF", "C4", "ARG"]
ignore = ["D203", "D213", "N818"]

[tool.ruff.lint.per-file-ignores]
"apps/conftest.py" = ["ARG001"]
"apps/*/tests/*" = ["D", "ARG001", "ARG002"]
"*/__init__.py" = ["D104"]
"*/admin.py" = ["ARG002"]
"*/management/commands/*.py" = ["ARG002"]
"*/models.py" = ["RUF012"]
"*/serializers.py" = ["RUF012"]
"*/permissions.py" = ["ARG002"]
"*/views.py" = ["ARG002", "RUF012"]
"config/urls.py" = ["ARG001"]
"core/exception_handler.py" = ["ARG001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
